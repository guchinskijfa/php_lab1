version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab_web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
    networks:
      - lab_network
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-auth_lab}
      - DB_USER=${DB_USER:-lab_user}
      - DB_PASSWORD=${DB_PASSWORD:-lab_password_456}
      - DB_PORT=${DB_PORT:-5432}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}

  db:
    image: postgres:15-alpine
    container_name: lab_db
    environment:
      POSTGRES_DB: ${DB_NAME:-auth_lab}
      POSTGRES_USER: ${DB_USER:-lab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lab_password_456}
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - lab_network



volumes:
  pg_data: {}                        

networks:
  lab_network:
    driver: bridge